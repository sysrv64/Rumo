[package]
name = "rumo_bridge"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "=0.22.4"
kurbo = "=0.13.1"
lyon_tessellation = "=1.0.22"
# Only used on the dedicated preview worker thread (never on a JNI thread):
# lazy GPU init + bounded readback wait, with CPU fallback on any failure.
pollster = "=0.4.0"
rumo_core = { path = "../rumo-core" }
rumo_export = { path = "../rumo-export" }
rumo_media = { path = "../rumo-media" }
rumo_render = { path = "../rumo-render" }

[dev-dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }
serde_json = "=1.0.151"
